<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- CereBruv Official Mascot -->
  <g fill="#E52E2E" stroke="#E52E2E" stroke-linejoin="round">
    <!-- Left Brain Lobes -->
    <path d="M 240,65 C 190,65 140,90 120,135 C 90,140 70,175 75,205 C 50,225 45,265 65,295 C 55,335 80,375 115,385 C 150,425 210,425 240,425 L 240,380 C 200,380 155,370 135,340 C 185,340 240,340 240,340 Z" />
    <!-- Right Brain Lobes -->
    <path d="M 260,65 C 310,65 360,90 380,135 C 410,140 430,175 425,205 C 450,225 455,265 435,295 C 445,335 420,375 385,385 C 350,425 290,425 260,425 L 260,380 C 300,380 345,370 365,340 C 315,340 260,340 260,340 Z" />
    <!-- Center Dividing Line -->
    <rect x="245" y="65" width="10" height="130" fill="#0D0D11" />
    <rect x="245" y="340" width="10" height="85" fill="#0D0D11" />
  </g>
  <!-- Face Cutout (Dark Obsidian Screen) -->
  <rect x="135" y="170" width="230" height="150" rx="75" fill="#0D0D11" />
  <!-- Mascot Face Expressions (Red) -->
  <!-- Left Eye: Winking Angle '>' -->
  <path d="M 175,215 L 215,245 L 175,275" fill="none" stroke="#E52E2E" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Eye: Friendly Horizontal Slit '-' -->
  <line x1="290" y1="245" x2="335" y2="245" stroke="#E52E2E" stroke-width="16" stroke-linecap="round" />
  <!-- Mouth: Smile curve -->
  <path d="M 225,270 Q 255,300 285,270" fill="none" stroke="#E52E2E" stroke-width="14" stroke-linecap="round" />
</svg>
